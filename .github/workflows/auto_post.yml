name: Auto Post Poem

on:
  schedule:
    # ⚠️ মনে রাখবেন: GitHub Actions-এর সর্বনিম্ন নির্ধারিত ব্যবধান 5 মিনিট
    # নিচের লেখাটি বোঝায় প্রতি 5 মিনিটে একবার চালাবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # এই লাইনটি আপনাকে ম্যানুয়ালি পরীক্ষা করার সুবিধা দেয়

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run poem bot
        # এখানে আপনার স্ক্রিপ্ট ফাইলের নাম দিন, যেমন kaka.py
        run: python kaka.py
        env:
          # গোপনীয় তথ্যগুলো এখানে রেফারেন্স করুন, নিচের তৃতীয় ধাপে এটি কনফিগার করতে হবে
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
